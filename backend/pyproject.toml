[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilinkbot-backend"
version = "0.1.0"
description = "Local iLink WeChat controller backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic-settings>=2.0,<3",
  "croniter>=2.0,<7",
  "segno>=1.6,<2",
  "wechatbot-sdk>=0.3,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
]

[project.scripts]
ilinkbot = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["control_allowlist.json"]

[tool.setuptools.data-files]
config = ["config/control_allowlist.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
